name: Validate Fabric Intent

on:
  push:
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --requirement requirements.txt

      - name: Compile validator
        run: python -m py_compile scripts/validate_fabric_intent.py

      - name: Validate reference fabric intent
        run: python scripts/validate_fabric_intent.py models/fabric-intent.yaml
